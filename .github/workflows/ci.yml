name: CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (hash-pinned)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Compile python sources
        run: |
          python -m py_compile bin/*.py clients/*.py

      - name: Lint with flake8 (syntax errors)
        run: |
          flake8 bin/ clients/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Validate JSON schemas
        run: |
          python -c "import json; json.load(open('schema/export.schema.json')); json.load(open('config/export_service.json'))"

      - name: Check shell scripts syntax
        run: |
          bash -n bin/*.sh scripts/*.sh

      - name: Assistant webhook field-mapping regression test
        run: |
          python3 clients/test_assistant_webhook.py

      - name: Regression tests (media enrichment + chat filtering)
        run: |
          for t in tests/test_*.py; do
            echo "== ${t}"
            python3 "${t}"
          done

  release:
    needs: lint-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Package Release Bundle (top-level prefix dir)
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          ARCHIVE_NAME="wx-linux-exporter-${TAG_NAME}.tar.gz"
          PREFIX="wx-linux-exporter-${TAG_NAME}"
          # Build an archive with a single top-level directory so users do not
          # get a tarbomb. Exclude VCS, CI metadata, and Python bytecode caches
          # (not shipped).
          STAGE=$(mktemp -d)
          mkdir -p "${STAGE}/${PREFIX}"
          tar --exclude='.git' --exclude='.github' --exclude='__pycache__' \
              --exclude='*.pyc' -cf - . | tar -xf - -C "${STAGE}/${PREFIX}"
          (cd "$STAGE" && tar -czf "${GITHUB_WORKSPACE:+$GITHUB_WORKSPACE/}${ARCHIVE_NAME}" "$PREFIX")
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"

      - name: Extract release notes from CHANGELOG
        run: |
          python3 - "${{ github.ref_name }}" <<'PY'
          import pathlib, re, sys
          tag = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pat = rf"^## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
          m = re.search(pat, text, re.S | re.M)
          body = (m.group(1).strip() if m else "") or f"Release {tag} — see CHANGELOG.md"
          pathlib.Path("RELEASE_NOTES.md").write_text(body + "\n", encoding="utf-8")
          print(body[:500])
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: false

  # Release Truth Gate (R-005): do not trust that the build "exited 0" — actually
  # unpack the shipped tarball in a clean temp dir and prove it works end-to-end.
  verify-release-tarball:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern 'wx-linux-exporter-${{ github.ref_name }}.tar.gz*' \
            --dir .

      - name: Unpack and verify tarball
        run: |
          set -euo pipefail
          ARCHIVE="wx-linux-exporter-${{ github.ref_name }}.tar.gz"
          SHA_FILE="${ARCHIVE}.sha256"
          WORK=$(mktemp -d)
          echo "== Working dir: $WORK"

          echo "== 1. SHA-256 sidecar matches the tarball =="
          sha256sum -c "$SHA_FILE"

          echo "== 2. tar tzf sanity (top-level prefix dir + expected entries) =="
          tar tzf "$ARCHIVE" > /tmp/manifest.txt
          head -n 20 /tmp/manifest.txt
          PREFIX="wx-linux-exporter-${{ github.ref_name }}/"
          grep -qE "(^|\\./)${PREFIX}CHANGELOG.md" /tmp/manifest.txt || { echo "FAIL: CHANGELOG.md missing from tarball"; exit 1; }
          grep -qE "(^|\\./)${PREFIX}scripts/selfcheck.sh" /tmp/manifest.txt || { echo "FAIL: scripts/selfcheck.sh missing"; exit 1; }

          echo "== 3. Extract into clean temp dir =="
          tar -xzf "$ARCHIVE" -C "$WORK"

          echo "== 4. py_compile every extracted .py =="
          mapfile -t PYS < <(find "$WORK" -name '*.py')
          if [ "${#PYS[@]}" -eq 0 ]; then echo "FAIL: no python files in tarball"; exit 1; fi
          python3 -m py_compile "${PYS[@]}"

          echo "== 5. self-contained smoke check =="
          if [ -f "$WORK/${PREFIX}scripts/selfcheck.sh" ]; then
            chmod +x "$WORK/${PREFIX}scripts/selfcheck.sh"
            bash "$WORK/${PREFIX}scripts/selfcheck.sh" || { echo "FAIL: selfcheck.sh returned non-zero"; exit 1; }
          else
            echo "FAIL: selfcheck.sh not present after extraction"; exit 1
          fi

          echo "== Release tarball verified OK =="
          rm -rf "$WORK"
