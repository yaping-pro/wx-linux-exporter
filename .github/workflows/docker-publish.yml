name: Publish Docker Image to GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=wx-linux-exporter
            org.opencontainers.image.description=Linux / Homelab WeChat export service, offline media decryptor & HTTP API daemon
            org.opencontainers.image.ocr=disabled

      - name: Build and push multi-arch Docker image
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            INSTALL_OCR=0
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify multi-arch image manifest
        run: |
          # Extract the first pushed tag generated by docker/metadata-action
          FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | head -n 1)
          if [ -z "$FIRST_TAG" ]; then
            echo "ERROR: steps.meta.outputs.tags is empty, no target to inspect"
            exit 1
          fi
          echo "Inspecting manifest for primary tag: ${FIRST_TAG}"
          MANIFEST_OUTPUT=$(docker buildx imagetools inspect "${FIRST_TAG}")
          echo "${MANIFEST_OUTPUT}"
          echo "${MANIFEST_OUTPUT}" | grep -q "linux/amd64" || { echo "ERROR: linux/amd64 missing from manifest"; exit 1; }
          echo "${MANIFEST_OUTPUT}" | grep -q "linux/arm64" || { echo "ERROR: linux/arm64 missing from manifest"; exit 1; }
          echo "Multi-arch verification succeeded: both linux/amd64 and linux/arm64 present."
