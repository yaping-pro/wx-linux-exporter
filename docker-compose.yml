services:
  api:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     INSTALL_OCR: "0"
    image: ${WXLE_IMAGE:-ghcr.io/yaping-pro/wx-linux-exporter:latest}
    container_name: wx-exporter-api
    profiles:
      - api
    restart: unless-stopped
    read_only: true
    user: "${PUID:-1000}:${PGID:-1000}"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      - PYTHONUNBUFFERED=1
      - WECHAT_VAULT_ROOT=/vault
      - WECHAT_MEDIA_POLICY=/vault/config/media_policy.json
      - WECHAT_MEDIA_LEDGER=/vault/state/media_ledger.json
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8765"
      - "--vault-dir"
      - "/vault/decrypted/current"
      - "--token"
      - "${WECHAT_TOKEN:?WECHAT_TOKEN environment variable must be explicitly set}"
    volumes:
      # 只读输入与媒体查询：解密快照 + 策略配置 + 账本 + 物化媒体目录
      - "${WECHAT_VAULT_HOST_DIR:-${HOME}/.local/share/wechat-vault}/decrypted:/vault/decrypted:ro"
      - "${WECHAT_VAULT_HOST_DIR:-${HOME}/.local/share/wechat-vault}/config:/vault/config:ro"
      - "${WECHAT_VAULT_HOST_DIR:-${HOME}/.local/share/wechat-vault}/state:/vault/state:ro"
      - "${WECHAT_VAULT_HOST_DIR:-${HOME}/.local/share/wechat-vault}/media:/vault/media:ro"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8765/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  worker:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     INSTALL_OCR: "0"
    image: ${WXLE_IMAGE:-ghcr.io/yaping-pro/wx-linux-exporter:latest}
    container_name: wx-exporter-worker
    profiles:
      - worker
    restart: unless-stopped
    read_only: true
    user: "${PUID:-1000}:${PGID:-1000}"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      - PYTHONUNBUFFERED=1
      - WECHAT_VAULT_ROOT=/vault
      - WECHAT_MEDIA_POLICY=/vault/config/media_policy.json
      - WECHAT_MEDIA_LEDGER=/vault/state/media_ledger.json
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        while true; do
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Running wxmedia sync...";
          wxmedia --policy /vault/config/media_policy.json --vault /vault;
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] exit=$$? — sleeping 300s";
          sleep 300;
        done
    volumes:
      # 只读输入：解密快照 + 策略
      - "${WECHAT_VAULT_HOST_DIR:?set WECHAT_VAULT_HOST_DIR}/decrypted:/vault/decrypted:ro"
      - "${WECHAT_VAULT_HOST_DIR:?set WECHAT_VAULT_HOST_DIR}/config:/vault/config:ro"
      # 可写输出：账本 / 物化媒体 / 导出 / 暂存
      - "${WECHAT_VAULT_HOST_DIR:?set WECHAT_VAULT_HOST_DIR}/state:/vault/state:rw"
      - "${WECHAT_VAULT_HOST_DIR:?set WECHAT_VAULT_HOST_DIR}/media:/vault/media:rw"
      - "${WECHAT_VAULT_HOST_DIR:?set WECHAT_VAULT_HOST_DIR}/exports:/vault/exports:rw"
      - "${WECHAT_VAULT_HOST_DIR:?set WECHAT_VAULT_HOST_DIR}/staging:/vault/staging:rw"
